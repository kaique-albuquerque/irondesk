name: Feature request
description: Propose an improvement to IronDesk
title: 'feat: '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Before proposing, check the
        [README](https://github.com/kaique-albuquerque/irondesk#readme) and the
        [roadmap](https://github.com/kaique-albuquerque/irondesk#14-roadmap).
        IronDesk is a demo with no backend — proposals that depend on a server, database or real
        billing are outside the scope of this repository.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the gym's day-to-day difficulty, not the solution.
      placeholder: At the end of the month I have to consolidate receipts in another system because...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How IronDesk should behave.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: Related module
      options:
        - Dashboard
        - Students
        - Plans
        - Enrollments
        - Attendance
        - Workouts
        - Assessments
        - Finance
        - Reports
        - Team
        - Integrations
        - Settings
        - Design system
        - Other
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Does this fit the demo version?
      options:
        - 'Yes — front end only with local data'
        - 'No — it would need a real backend/API'
        - 'I do not know'
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Links, images or products that do something similar.
    validations:
      required: false
