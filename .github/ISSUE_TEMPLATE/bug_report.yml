name: Bug
description: Report unexpected behavior in IronDesk
title: 'bug: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Before continuing, confirm you are on the latest version of the
        `main` branch and that the problem is not already listed in the existing issues.

        Found a **security vulnerability**? Do not use this form — see
        [SECURITY.md](https://github.com/kaique-albuquerque/irondesk/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: Describe the observed behavior and what was expected.
      placeholder: When clicking "Renew" on the Enrollments screen, the list does not refresh...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. Go to '...'
        2. Click on '...'
        3. See the error
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Affected module
      options:
        - Dashboard
        - Students
        - Plans
        - Enrollments
        - Attendance
        - Workouts
        - Assessments
        - Finance
        - Reports
        - Team
        - Integrations
        - Settings
        - Navigation / layout / theme
        - Other
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Paste the browser console output, if any.
      render: shell

  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 138 / Windows 11
    validations:
      required: true

  - type: dropdown
    id: persistence
    attributes:
      label: Does the problem go away after restoring the demo data?
      description: Settings → Restore demo data
      options:
        - 'Yes'
        - 'No'
        - 'I did not test it'
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, screen recordings, notes.
    validations:
      required: false
